<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD·3D모델링 마스터</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
    --ink:#0f172a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 100px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  code,.cmd{font-family:Consolas,"D2Coding",monospace;background:#0f172a;color:#e2e8f0;
       border-radius:6px;padding:1px 7px;font-size:13.5px;font-weight:700;display:inline-block}
  .body ul{margin:8px 0;padding-left:20px}
  .body li{margin:3px 0}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}

  /* 단원 접기 */
  .unitbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .ub{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);
      cursor:pointer;font-weight:700;font-size:13px;color:var(--dim)}
  .ub.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* 게임 공통 */
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .gpick{display:flex;gap:8px;flex-wrap:wrap}
  .gpick button{flex:1 1 46%;min-width:140px;border:1px solid var(--line);background:var(--card);
      border-radius:10px;padding:12px;cursor:pointer;font-weight:700;font-size:15px}
  .gpick button:hover{border-color:var(--pri)}
  .gpick button.correct{border-color:var(--ok);background:#eafaf1}
  .gpick button.wrong{border-color:var(--no);background:#fdeeee}
  .hud{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-weight:800;font-size:14px;margin-bottom:10px}
  .hud .combo{color:var(--warn)}
  .gameGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .gameGrid .gm{border:1px solid var(--line);border-radius:12px;background:var(--card);
      padding:14px;cursor:pointer;text-align:left}
  .gameGrid .gm:hover{border-color:var(--pri)}
  .gameGrid .gm b{display:block;font-size:15px;margin-bottom:3px}
  .gameGrid .gm span{color:var(--dim);font-size:13px}

  svg{max-width:100%;height:auto;display:block}
  .fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0;overflow-x:auto}
  .figsm{max-width:330px;margin:10px auto}
  .figmd{max-width:560px;margin:10px auto}

  /* 레이어 게임 표 */
  table.lay{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
  table.lay th,table.lay td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  table.lay th{background:#f1f4f8;font-size:13px}
  .swatch{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid #0002;
      vertical-align:-2px;margin-right:5px}
  .slotbox{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .slotbox button{border:1px solid var(--line);background:var(--card);border-radius:9px;
      padding:9px 11px;cursor:pointer;font-weight:700;font-size:13.5px}
  .slotbox button:hover{border-color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📐 CAD·3D모델링 마스터</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="game">🎮 게임</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
  </div>

  <div id="view"></div>
</div>

/* ── 솔리드웍스 피처 그림 — 스케치(왼쪽) → 결과(오른쪽) ── */
const ISO = (x,y,z)=>[ (x-y)*0.866, (x+y)*0.5 - z ];   // 등각 투영
function isoPoly(pts, fill, stroke, sw){
  const d = pts.map((p,i)=>{ const q=ISO(p[0],p[1],p[2]); return (i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' ')+' Z';
  return '<path d="'+d+'" fill="'+fill+'" stroke="'+(stroke||'#334155')+'" stroke-width="'+(sw||1.6)+'" stroke-linejoin="round"/>';
}
function isoBox(x,y,z,w,d,h){
  return isoPoly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]], '#dbeafe')
       + isoPoly([[x,y,z],[x+w,y,z],[x+w,y,z+h],[x,y,z+h]],         '#93c5fd')
       + isoPoly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]], '#60a5fa');
}
function isoDot(x,y,z,r,fill){
  const q = ISO(x,y,z);
  return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+r+'" fill="'+(fill||'#1e293b')+'"/>';
}
const ARROW = '<text x="42" y="4" font-size="17" fill="#94a3b8">&#10142;</text>';

{ unit:'Ⅰ. CAD 시작하기', t:'객체 선택 — 윈도우와 크로싱', body:
  '<code>ERASE</code>·<code>COPY</code>·<code>MOVE</code>·<code>MIRROR</code> 같은 편집 명령에서 ' +
  '「객체 선택 :」 이 나오면 두 가지 방법이 대표적이다.' +
  '<ul><li><b>윈도우(Window)</b> — 사각형 <b>안에 완전히 들어온 것만</b> 선택된다.</li>' +
  '<li><b>크로싱(Crossing)</b> — 사각형에 <b>걸치기만 해도</b> 선택된다.</li></ul>' +
  '잘라낼 것을 고를 때(<code>TRIM</code>)는 크로싱이 편하다.' },

/* ───────────── Ⅱ. 좌표와 그리기 ───────────── */
{ unit:'Ⅱ. 좌표와 그리기', t:'좌표를 넣는 세 가지 방법', body:
  '선·원을 그리거나 점을 지정할 때 위치·방향·각도를 정확히 넣기 위해 좌표를 쓴다. ' +
  '<b>이 셋을 구분하는 것이 2D CAD 의 처음이자 끝이다.</b>' + FIG.coord +
  '<ul><li><b>절대좌표 <code>x,y</code></b> — 도면 원점(0,0)에서 잰 값. 예 <code>70,20</code></li>' +
  '<li><b>상대좌표 <code>@x,y</code></b> — <b>바로 앞에 찍은 점</b>에서 얼마나 갔는지. 예 <code>@50,0</code></li>' +
  '<li><b>상대극좌표 <code>@거리&lt;각도</code></b> — 앞 점에서 <b>거리와 각도</b>로. 예 <code>@30&lt;90</code></li></ul>' +
  '<b>@ 가 붙으면 「앞 점 기준」</b> 이라고 외우면 된다.' },

{ unit:'Ⅱ. 좌표와 그리기', t:'같은 사각형을 세 방법으로 그려 보기', body:
  '가로 50, 세로 30 인 직사각형을 (20,20) 에서 시작해 그린다. <b>결과는 똑같다.</b>' +
  '<div style="overflow-x:auto"><table class="lay">' +
  '<tr><th>절대좌표</th><th>상대좌표</th><th>상대극좌표</th></tr>' +
  '<tr><td><code>20,20</code></td><td><code>20,20</code></td><td><code>20,20</code></td></tr>' +
  '<tr><td><code>70,20</code></td><td><code>@50,0</code></td><td><code>@50&lt;0</code></td></tr>' +
  '<tr><td><code>70,50</code></td><td><code>@0,30</code></td><td><code>@30&lt;90</code></td></tr>' +
  '<tr><td><code>20,50</code></td><td><code>@-50,0</code></td><td><code>@50&lt;180</code></td></tr>' +
  '<tr><td><code>c</code></td><td><code>@0,-30</code> 또는 <code>C</code></td><td><code>@30&lt;270</code> 또는 <code>C</code></td></tr>' +
  '</table></div>' +
  '마지막에 <b><code>C</code>(닫기)</b> 를 넣으면 시작점까지 저절로 이어진다. ' +
  '기울어진 변은 상대좌표로 계산하기 어렵다 — 그때가 <b>상대극좌표를 쓸 자리</b>다. ' +
  '한 변이 80 인 정오각형은 <code>@80&lt;0</code> → <code>@80&lt;72</code> → <code>@80&lt;144</code> 처럼 이어 그린다.' },

{ unit:'Ⅱ. 좌표와 그리기', t:'선 그리기 — LINE 과 XLINE', body:
  '<ul><li><code>LINE</code>(L) — 점을 이어 선을 그린다. 그리는 중에 <code>U</code> 로 한 칸 되돌리고, ' +
  '<code>C</code> 로 처음 점까지 닫는다.</li>' +
  '<li><code>XLINE</code>(XL) — 화면 끝까지 이어지는 <b>무한선</b>. 점을 중심으로 돌릴 수 있어 ' +
  '<b>중심선</b>을 잡을 때 많이 쓴다.</li></ul>' },

{ unit:'Ⅱ. 좌표와 그리기', t:'이어진 하나로 그리기 — PLINE · POLYGON · RECTANG', body:
  '<ul><li><code>PLINE</code>(PL) — 여러 개의 선과 호가 <b>하나의 연속된 요소</b>가 된다. ' +
  '두께를 줄 수 있어 <b>표면처리 기호나 단면 처리</b>에 쓴다.</li>' +
  '<li><code>POLYGON</code>(POL) — 삼각형부터 <b>1024각형</b>까지. 원에 <b>내접</b>하거나 <b>외접</b>하게, ' +
  '또는 한 변의 길이로 크기를 정한다.</li>' +
  '<li><code>RECTANG</code>(REC) — 대각선상의 두 점으로 직사각형. ' +
  '<b>모따기(C)와 모깎기(F)를 그리면서 같이</b> 줄 수 있다. 테두리선을 그릴 때 많이 쓴다.</li></ul>' +
  '이 셋은 모두 <b>폴리선이라 통째로 하나</b>다. 낱개로 다루려면 <code>EXPLODE</code> 로 분해해야 한다.' },

{ unit:'Ⅱ. 좌표와 그리기', t:'둥근 것 — CIRCLE · ARC · ELLIPSE', body:
  '<code>CIRCLE</code>(C) 은 상황에 따라 옵션을 골라 쓴다 — ' +
  '<b>r</b>(반지름) · <b>d</b>(지름) · <b>2p</b>(두 점) · <b>3p</b>(세 점) · ' +
  '<b>ttr</b>(두 곳에 접하고 반지름) · <b>ttt</b>(세 곳에 접함).<br>' +
  '<code>ARC</code>(A) 는 호, <code>ELLIPSE</code>(EL) 는 타원이다. 타원은 <b>한 축의 지름</b>과 ' +
  '<b>다른 축의 반지름</b>을 넣는다는 점을 조심한다.<br>' +
  '<code>SPLINE</code>(SPL) 은 자유 곡선이다.' },

{ unit:'Ⅱ. 좌표와 그리기', t:'점과 도넛 — POINT · DDPTYPE · DONUT', body:
  '<ul><li><code>POINT</code>(PO) — 기준점을 만들거나 분할 위치를 표시할 때 쓴다.</li>' +
  '<li><code>DDPTYPE</code> — 점이 너무 작아 안 보일 때 <b>점의 모양과 크기</b>를 바꾼다.</li>' +
  '<li><code>DONUT</code>(DO) — <b>내경과 외경</b>을 넣으면 그 사이가 채워진다. 내경을 0 으로 하면 꽉 찬 원이 된다.</li></ul>' },

/* ───────────── Ⅲ. 편집 ───────────── */
{ unit:'Ⅲ. 도면 편집하기', t:'지우기와 되돌리기', body:
  '<ul><li><code>ERASE</code>(E) — 지운다.</li>' +
  '<li><code>OOPS</code> — <b>가장 최근에 지운 것</b>을 되살린다. <b>단 한 번만</b> 된다.</li>' +
  '<li><code>U</code> — 바로 앞에 한 명령을 취소한다(<b>UNDO</b> 의 줄임).</li>' +
  '<li><code>REDO</code> — 취소한 것을 다시 살린다.</li></ul>' +
  '<code>OOPS</code> 와 <code>U</code> 는 다르다 — <code>OOPS</code> 는 <b>지운 것만</b> 되살리고, ' +
  '<code>U</code> 는 <b>무슨 명령이든</b> 되돌린다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'옮기고 복사하기 — COPY · MOVE · MIRROR', body:
  '<code>COPY</code>(CO) 와 <code>MOVE</code>(M) 는 <b>쓰는 법이 똑같고</b>, ' +
  '원래 것이 남느냐 아니냐만 다르다.<br>' +
  '<code>MIRROR</code> 는 두 점을 축으로 <b>대칭 복사</b>한다. 기계요소는 상하·좌우 대칭이 많아 아주 자주 쓴다.<br>' +
  '<b>함정</b> — 문자까지 뒤집혀 읽을 수 없게 된다. 시스템 변수 <code>MIRRTEXT</code> 를 바꾸면 ' +
  '<b>글자는 바로 선 채로</b> 대칭된다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'OFFSET — 도면 요소의 대부분을 만드는 명령', body:
  '<code>OFFSET</code>(O) 은 선택한 요소에서 <b>일정한 간격만큼 떨어진 같은 모양</b>을 하나 더 만든다. ' +
  '교재는 이 명령을 두고 <b>「도면 요소 생성의 대부분을 차지한다」</b> 고 적고 있다.<br>' +
  '<b>원을 오프셋하면 동심원</b>이 된다는 것을 기억하면 판재의 두께, 벽의 두께를 아주 빨리 그릴 수 있다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'ARRAY — 규칙적으로 여러 개', body:
  '<code>ARRAY</code>(AR) 는 고른 요소를 일정 간격으로 여러 개 복사한다.' +
  '<ul><li><b>사각형(R)</b> — 행과 열로 늘어놓는다.</li>' +
  '<li><b>원형(P)</b> — 중심을 잡고 <b>빙 둘러</b> 늘어놓는다.</li></ul>' +
  '복사된 것 하나하나를 따로 고칠 수 있다. 플랜지의 볼트 구멍처럼 <b>같은 것이 규칙적으로 여럿</b>일 때 ' +
  '하나만 그리고 나머지는 <code>ARRAY</code> 로 만든다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'크기 바꾸기 — SCALE 과 STRETCH', body:
  '<ul><li><code>SCALE</code>(SC) — <b>배율</b>로 전체를 키우거나 줄인다. 모양은 그대로다.</li>' +
  '<li><code>STRETCH</code>(S) — 일부만 잡아 <b>늘이거나 줄인다.</b> 전체 비율이 아니라 한쪽만 길어진다.</li></ul>' +
  '가로만 20 늘려야 하는데 <code>SCALE</code> 을 쓰면 세로까지 같이 커져 버린다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'TRIM 과 EXTEND — 짝으로 외운다', body:
  '<ul><li><code>TRIM</code>(TR) — 경계를 정하고, <b>튀어나온 부분을 잘라낸다.</b> ' +
  '자를 것을 고를 때 <b>크로싱</b>을 쓰면 편하다.</li>' +
  '<li><code>EXTEND</code>(EX) — 경계를 정하고, <b>모자란 선을 그 경계까지 늘린다.</b></li></ul>' +
  '두 명령은 하는 일이 정반대이고 쓰는 순서가 같다 — <b>먼저 경계, 그 다음 대상</b>이다.<br>' +
  '<code>BREAK</code>(BR) 는 잘라내지 않고 <b>중간을 끊어</b> 둘로 나눈다.' },

{ unit:'Ⅲ. 도면 편집하기', t:'모서리 다듬기 — CHAMFER 와 FILLET', body:
  '<ul><li><code>CHAMFER</code>(CHA) — <b>모따기</b>. 모서리를 비스듬히 깎는다. 도면에는 <b>C</b> 로 적는다(예 C1).</li>' +
  '<li><code>FILLET</code>(F) — <b>모깎기</b>. 모서리를 둥글게 굴린다. 도면에는 <b>R</b> 로 적는다(예 R3).</li></ul>' +
  '<code>EXPLODE</code>(X) 는 폴리선·블록·해칭과 <b>치수 기입한 요소</b>(치수선·치수보조선·치수문자·화살표)를 ' +
  '낱개로 분해한다.' },

/* ───────────── Ⅳ. 해칭·문자·도면층 ───────────── */
{ unit:'Ⅳ. 해칭 · 문자 · 도면층', t:'해칭 — BHATCH', body:
  '해칭은 도면의 <b>일정한 영역을 무늬로 채우는</b> 것으로, 조립 부품의 <b>재질</b>이나 <b>단면</b>을 나타낸다. ' +
  '보통 경계해치(<code>BHATCH</code>, BH)를 쓴다 — 해칭 조건과 영역을 정하면 <b>자동으로</b> 채워 준다.<br>' +
  '이미 넣은 해칭을 고칠 때는 <code>HATCHEDIT</code>(HE) 다.<br>' +
  '<b>영역이 완전히 닫혀 있지 않으면 해칭이 안 된다</b> — 이때는 끊긴 자리를 찾아 <code>TRIM</code>·<code>EXTEND</code> 로 붙인다.' },

{ unit:'Ⅳ. 해칭 · 문자 · 도면층', t:'문자 — STYLE · DTEXT · MTEXT', body:
  '기계도면에서 문자는 <b>표제란·주서·부품란</b>처럼 설계자의 뜻을 제작자에게 전하는 자리에 쓴다.' +
  '<ul><li><code>STYLE</code>(ST) — 글꼴·크기·모양을 <b>미리 정해 둔다.</b></li>' +
  '<li><code>DTEXT</code>(DT) — <b>한 줄</b> 문자.</li>' +
  '<li><code>MTEXT</code>(T) — <b>여러 줄</b> 문자. 주서처럼 문단으로 쓸 때.</li>' +
  '<li><code>DDEDIT</code> — 이미 쓴 문자의 내용을 고친다.</li>' +
  '<li><code>FIND</code> — 문자를 찾아 바꾼다.</li></ul>' },

{ unit:'Ⅳ. 해칭 · 문자 · 도면층', t:'도면층(LAYER) — 투명 도면을 여러 장 겹친 것', body:
  '<span class="kw">도면층(Layer)</span> 은 <b>투명한 도면을 여러 장 겹쳐 놓은 것</b>이다. ' +
  '도면의 정보를 층마다 나누어 담고, 필요한 층만 보이게 하거나 잠글 수 있다.' +
  '<ul><li><b>켜기/끄기</b> — 보이게 하거나 감춘다.</li>' +
  '<li><b>동결</b> — 감추면서 속도까지 올린다. <b>현재 도면층은 동결할 수 없다.</b></li>' +
  '<li><b>잠금</b> — 보이기는 하지만 <b>수정할 수 없다.</b></li>' +
  '<li><b>색상 · 선종류 · 선가중치</b> — 층마다 따로 정한다.</li>' +
  '<li><b>플롯</b> — 그 층을 출력할지 정한다. <b>꺼져 있거나 동결된 층은 어차피 출력되지 않는다.</b></li></ul>' +
  '<code>"0"</code> 도면층과 Defpoints 는 <b>삭제할 수 없다.</b><br>' +
  '중심선을 예로 만들어 보면 — 이름 「중심선」, 색 <b>빨강</b>, 선종류 <b>Center</b>(없으면 <b>로드</b>해서 쓴다), ' +
  '선가중치 <b>0.25</b>(중심선은 보통 0.1~0.25mm).' },

{ unit:'Ⅳ. 해칭 · 문자 · 도면층', t:'블록 — BLOCK 과 INSERT', body:
  '자주 쓰는 기호나 부품을 <code>BLOCK</code> 으로 묶어 두었다가 <code>INSERT</code> 로 불러 쓴다. ' +
  '블록은 <b>단일 요소로 취급</b>되고, 불러 넣을 때 <b>위치·크기·회전</b>을 자유롭게 정할 수 있다. ' +
  '표면거칠기 기호처럼 도면 곳곳에 되풀이되는 것에 알맞다.' },

/* ───────────── Ⅴ. 치수 기입과 출력 ───────────── */
{ unit:'Ⅴ. 치수 기입과 출력', t:'길이 치수 — 선형과 정렬', body:
  '<ul><li><code>DIMLINEAR</code>(DIMLIN) — <b>수평·수직</b> 방향의 길이.</li>' +
  '<li><code>DIMALIGNED</code>(DIMALIN) — <b>기울어진 면과 나란하게.</b> 경사면의 실제 길이를 잴 때 쓴다.</li></ul>' +
  '경사면에 선형 치수를 쓰면 <b>비스듬한 실제 길이가 아니라 수평 거리</b>가 적혀 도면이 틀린다.' },

{ unit:'Ⅴ. 치수 기입과 출력', t:'둥근 것의 치수 — 반지름 · 지름 · 각도', body:
  '<ul><li><code>DIMRADIUS</code> — 반지름. 앞에 <b>R</b> 이 붙는다.</li>' +
  '<li><code>DIMDIAMETER</code> — 지름. 앞에 <b>&#8960;</b> 가 붙는다.</li>' +
  '<li><code>DIMANGULAR</code> — 각도.</li>' +
  '<li><code>DIMCENTER</code> — 원·호의 <b>중심 표시</b>를 넣는다.</li></ul>' +
  '<b>완전한 원은 지름, 원의 일부(호)는 반지름</b>으로 적는 것이 원칙이다.' },

{ unit:'Ⅴ. 치수 기입과 출력', t:'여러 개를 이어서 — QDIM · 기준선 · 연속', body:
  '<ul><li><code>QDIM</code> — 여러 치수를 <b>한 번에 빠르게</b> 넣는다.</li>' +
  '<li><code>DIMBASELINE</code> — <b>한 기준선에서</b> 각각 재어 나간다. 치수가 층층이 쌓인다.</li>' +
  '<li><code>DIMCONTINUE</code> — <b>앞 치수의 끝에서 이어</b> 나간다. 치수가 한 줄로 늘어선다.</li></ul>' +
  '누적 오차를 막아야 하는 자리에는 기준선 치수를, 칸칸의 길이가 중요한 자리에는 연속 치수를 쓴다.' },

{ unit:'Ⅴ. 치수 기입과 출력', t:'지시선과 공차 — QLEADER · TOLERANCE', body:
  '<code>QLEADER</code>(LE) 는 <b>지시선</b>을 그어 설명을 붙인다. 모따기·구멍 가공 지시에 쓴다.<br>' +

const CFG = {
  practiceN : 8,
  examN     : 20,
  gameN     : 10,
  storeKey  : 'cad-3d-master_v1',
};

/* ══════════════ 여기부터는 대개 손대지 않습니다 ══════════════ */

const $  = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const pick1 = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 받침에 따라 조사를 고른다 — "치수문자은" 같은 어색한 말이 나오지 않게 */
function jong(w){ const c=w.charCodeAt(w.length-1); return (c>=0xAC00&&c<=0xD7A3)?(c-0xAC00)%28:-1; }
const josaEun = w => w + (jong(w)>0 ? '은' : '는');
const josaRo  = w => w + ((jong(w)<=0||jong(w)===8) ? '로' : '으로');

const ST = load();
function load(){
  try{ return Object.assign({wrong:[],done:{},best:{}}, JSON.parse(localStorage.getItem(CFG.storeKey)||'{}')); }
  catch(e){ return {wrong:[],done:{},best:{}}; }
}
function save(){ try{ localStorage.setItem(CFG.storeKey, JSON.stringify(ST)); }catch(e){} }

let quiz = null;
let lastResult = null;
let learnUnit = null;

/* ── 화면 전환 ── */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    render(t.dataset.view);
  };
});
function goTab(v){ const b=document.querySelector('[data-view="'+v+'"]'); if(b) b.click(); }

function render(view){
  const v = $('#view');
  v.innerHTML = '';
  if(view==='learn')    return renderLearn(v);
  if(view==='game')     return renderGameMenu(v);
  if(view==='practice') return startQuiz(v,'practice');
  if(view==='exam')     return startQuiz(v,'exam');
  if(view==='wrong')    return renderWrong(v);
}

/* ── 배우기 ── */
function renderLearn(v){
  const units = [];
  LEARN.forEach(c=>{ if(units.indexOf(c.unit)<0) units.push(c.unit); });
  if(!learnUnit || units.indexOf(learnUnit)<0) learnUnit = units[0];

  const bar = el('<div class="unitbar"></div>');
  units.forEach(u=>{
    const b = el('<button class="ub'+(u===learnUnit?' on':'')+'">'+u+'</button>');
    b.onclick = ()=>{ learnUnit = u; render('learn'); window.scrollTo(0,0); };
    bar.appendChild(b);
  });
  v.appendChild(bar);

  LEARN.filter(c=>c.unit===learnUnit).forEach(c=>{
    v.appendChild(el('<div class="card"><span class="pill">'+c.unit+'</span>'
      + '<h3>'+c.t+'</h3><div class="body">'+c.body+'</div></div>'));
  });

  const i = units.indexOf(learnUnit);
  const nav = el('<div class="card row"></div>');
  if(i>0){ const p=el('<button class="btn">← '+units[i-1]+'</button>');
    p.onclick=()=>{ learnUnit=units[i-1]; render('learn'); window.scrollTo(0,0); }; nav.appendChild(p); }
  if(i<units.length-1){ const n=el('<button class="btn btn-primary">'+units[i+1]+' →</button>');
    n.onclick=()=>{ learnUnit=units[i+1]; render('learn'); window.scrollTo(0,0); }; nav.appendChild(n); }
  else {
    const g=el('<button class="btn btn-primary">🎮 게임으로 익히기</button>');
    g.onclick=()=>goTab('game'); nav.appendChild(g);
    const q=el('<button class="btn">✏️ 연습 '+CFG.practiceN+'문항</button>');
    q.onclick=()=>goTab('practice'); nav.appendChild(q);
  }
  v.appendChild(nav);
}

/* ── 좌표 입력 문제 (자동 생성) ── */
const DIRS = [ {dx:1,dy:0,ang:0}, {dx:0,dy:1,ang:90}, {dx:-1,dy:0,ang:180}, {dx:0,dy:-1,ang:270} ];
function coordGrid(x1,y1,x2,y2,d){
  const S=2.2, OX=24, OY=176, X=v=>OX+v*S, Y=v=>OY-v*S;
  let g='';
  for(let i=0;i<=8;i++){ g+='<line x1="'+X(i*10)+'" y1="'+Y(0)+'" x2="'+X(i*10)+'" y2="'+Y(70)+'" stroke="#eceff3"/>'; }
  for(let i=0;i<=7;i++){ g+='<line x1="'+X(0)+'" y1="'+Y(i*10)+'" x2="'+X(80)+'" y2="'+Y(i*10)+'" stroke="#eceff3"/>'; }
  const up = (d && d.dy>0), horiz = (d && d.dy===0);
  const l1y = (up||horiz) ? Y(y1)+17 : Y(y1)-10;
  const l2y = (up||horiz) ? Y(y2)-10 : Y(y2)+17;
  return '<div class="fig figsm"><svg viewBox="0 0 220 200" role="img" aria-label="좌표 입력 문제 그림">'
    + g
    + '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(84)+'" y2="'+Y(0)+'" stroke="#94a3b8" stroke-width="1.4"/>'
    + '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(74)+'" stroke="#94a3b8" stroke-width="1.4"/>'
    + '<text x="'+(X(0)-16)+'" y="'+(Y(0)+13)+'" font-size="9" fill="#94a3b8">0,0</text>'
    + '<line x1="'+X(x1)+'" y1="'+Y(y1)+'" x2="'+X(x2)+'" y2="'+Y(y2)+'" stroke="#2563eb" stroke-width="2.6"'
    + ' stroke-dasharray="5 4"/>'
    + '<circle cx="'+X(x1)+'" cy="'+Y(y1)+'" r="4" fill="#12a150"/>'
    + '<text x="'+(X(x1)+7)+'" y="'+l1y+'" font-size="10.5" font-weight="800" fill="#12a150">P1 ('+x1+','+y1+')</text>'
    + '<circle cx="'+X(x2)+'" cy="'+Y(y2)+'" r="4" fill="#e5484d"/>'
    + '<text x="'+(X(x2)+7)+'" y="'+l2y+'" font-size="10.5" font-weight="800" fill="#e5484d">P2</text>'
    + '</svg></div>';
}
function makeCoordQ(){
  const len = pick1([20,30,40,50]);
  const d   = pick1(DIRS);
  let x1 = pick1([10,20,30,40]), y1 = pick1([10,20,30,40]);
  let x2 = x1 + d.dx*len, y2 = y1 + d.dy*len;
  if(x2<0||y2<0||x2>80||y2>70) return makeCoordQ();
  const mode = pick1(['절대좌표','상대좌표','상대극좌표']);
  const abs = x2+','+y2, rel = '@'+(d.dx*len)+','+(d.dy*len), pol = '@'+len+'<'+d.ang;
  const badPol = '@'+len+'<'+pick1(DIRS.filter(t=>t.ang!==d.ang)).ang;
  const badRel = '@'+(-d.dx*len)+','+(-d.dy*len);
  let ans, pool;
  if(mode==='절대좌표'){ ans = abs; pool = [rel, x1+','+y1, (x2+10)+','+y2]; }
  else if(mode==='상대좌표'){ ans = rel; pool = [abs, badRel, pol]; }
  else { ans = pol; pool = [rel, badPol, abs]; }
  const ch = shuffle([ans].concat(pool)).slice(0,4);
  if(ch.indexOf(ans)<0){ ch[0]=ans; }
  return {
    fig : coordGrid(x1,y1,x2,y2,d),
    q   : 'P1 에서 P2 로 선을 이으려 한다. <b>'+mode+'</b>'+josaRo(mode).slice(mode.length)+' 입력하면?',
    ch  : ch.map(c=>'<code>'+esc(c)+'</code>'),
    a   : ch.indexOf(ans),
    tag : '좌표 입력 — '+mode,
    ex  : mode==='절대좌표' ? '절대좌표는 원점에서 잰 값이라 @ 를 붙이지 않는다.'
        : mode==='상대좌표' ? '앞 점에서 x 로 '+(d.dx*len)+', y 로 '+(d.dy*len)+' 만큼 갔다. @ 를 붙인다.'
        : '앞 점에서 거리 '+len+', 각도 '+d.ang+'° 방향이다.'
  };
}

/* ── 명령어 문제 ── */
function makeCmdQ(){
  const c = pick1(CMDS);
  const kind = Math.random()<0.5 ? 'name' : 'short';
  if(kind==='name'){
    const pool = shuffle(CMDS.filter(x=>x[1]!==c[1])).slice(0,3).map(x=>x[1]);
    const ch = shuffle([c[1]].concat(pool));
    return { q:'다음 일을 하는 명령어는?<br><span class="muted">'+c[0]+'</span>',
             ch:ch.map(x=>'<code>'+x+'</code>'), a:ch.indexOf(c[1]),
             tag:'명령어 찾기', ex:'<code>'+c[1]+'</code> — '+c[0]+' (단축키 <code>'+c[2]+'</code>)' };
  }
  const same = CMDS.filter(x=>x[2]!==c[2]);
  const pool = shuffle(same).slice(0,3).map(x=>x[2]);
  const ch = shuffle([c[2]].concat(pool));
  return { q:'<code>'+c[1]+'</code> 명령의 단축키는?',
           ch:ch.map(x=>'<code>'+x+'</code>'), a:ch.indexOf(c[2]),
           tag:'명령어 찾기', ex:'<code>'+c[1]+'</code> 는 '+c[0] };
}

/* ── 레이어 배정 문제 ── */
const LAYITEMS = [
  ['윤곽선',1],['외형선',2],['중심마크',2],['개별주서',2],['표제란 외곽',2],
  ['숨은선',3],['치수문자',3],['일반주서',3],['표제란 글자',3],
  ['해칭선',4],['치수선',4],['치수보조선',4],['표제란 안쪽',4],
  ['중심선',5],['절단선',6],
];
function layChip(l){
  return '<span class="swatch" style="background:'+l.hex+'"></span>'
       + '<b>'+l.no+'번</b> '+l.color+' · '+l.w+' · '+l.line;
}
function makeLayerQ(){
  const it = pick1(LAYITEMS);
  const right = LAYERS[it[1]-1];
  const pool = shuffle(LAYERS.filter(l=>l.no!==right.no)).slice(0,3);
  const ch = shuffle([right].concat(pool));
  return { q:'<b>'+it[0]+'</b>'+josaEun(it[0]).slice(it[0].length)+' 어느 레이어로 정하는가?',
           ch:ch.map(layChip), a:ch.indexOf(right),
           tag:'레이어 배정',
           ex:josaEun(it[0])+' '+right.no+'번 레이어다 — '+right.color+' · '+right.w+' · '+right.line+'.' };
}

/* ── 피처 고르기 문제 ── */
const FEATKEYS = Object.keys(FEAT);
function makeFeatQ(){
  const k = pick1(FEATKEYS);
  const pool = shuffle(FEATKEYS.filter(x=>x!==k)).slice(0,3);
  const ch = shuffle([k].concat(pool));

           q:'왼쪽에서 오른쪽으로 바뀌었다. 어떤 피처를 쓴 것인가?',

}

/* ── 게임 진행 ── */
let game = null;
function startGame(key){
  const v = $('#view'); v.innerHTML='';
  game = { key, i:0, correct:0, combo:0, maxCombo:0, wrong:[], start:Date.now() };
  drawGame(v);
}
function drawGame(v){
  const G = GAMES[game.key];
  if(game.i >= CFG.gameN) return finishGame(v);
  const Q = G.make();
  game.cur = Q;
  v.innerHTML='';
  v.appendChild(el('<div class="progress"><i style="width:'+(game.i/CFG.gameN*100)+'%"></i></div>'));
  const card = el('<div class="gcard">'
    + '<div class="hud"><span>'+G.name+'</span>'
    + '<span class="muted">'+(game.i+1)+' / '+CFG.gameN+'</span>'
    + '<span>⭕ '+game.correct+'</span>'
    + '<span class="combo">'+(game.combo>1 ? '🔥 '+game.combo+' 콤보' : '')+'</span></div>'
    + (Q.fig||'')
    + '<div class="qtext">'+Q.q+'</div>'
    + '<div class="gpick" id="gp"></div><div id="gex"></div></div>');
  v.appendChild(card);
  const gp = card.querySelector('#gp');
  Q.ch.forEach((c,idx)=>{
    const b = el('<button>'+c+'</button>');
    b.onclick = ()=>answerGame(v, idx, b);
    gp.appendChild(b);
  });
}
function answerGame(v, idx, btn){
  const Q = game.cur, ok = idx===Q.a;
  v.querySelectorAll('#gp button').forEach((b,i)=>{
    b.disabled = true;
    if(i===Q.a) b.classList.add('correct');
    if(i===idx && !ok) b.classList.add('wrong');
  });
  if(ok){ game.correct++; game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo); }
  else  { game.combo=0; game.wrong.push(Q.tag+' — '+Q.q.replace(/<[^>]+>/g,'').slice(0,30)); }
  try{ if(window.FX){ ok ? FX.burst(btn) : FX.shake(btn); if(ok && game.combo>=3) FX.punch(btn); } }catch(e){}

  const ex = v.querySelector('#gex');
  ex.appendChild(el('<div class="explain"><b>'+(ok?'맞았습니다':'다시 보기')+'</b><br>'+Q.ex+'</div>'));
  const nb = el('<div class="row" style="margin-top:10px"><button class="btn btn-primary">'
    + (game.i+1>=CFG.gameN?'결과 보기':'다음 →')+'</button></div>');
  ex.appendChild(nb);
  nb.querySelector('button').onclick = ()=>{ game.i++; drawGame(v); };
}
function finishGame(v){
  const G = GAMES[game.key];
  const pct = Math.round(game.correct/CFG.gameN*100);
  const sec = Math.round((Date.now()-game.start)/1000);
  if(!(game.key in ST.best) || pct > ST.best[game.key]) ST.best[game.key] = pct;
  save();

  v.innerHTML='';
  v.appendChild(el('<div class="card" style="text-align:center">'
    + '<div class="score">'+pct+'점</div>'
    + '<div class="muted">'+CFG.gameN+'문제 중 '+game.correct+'개 정답 · 최고 콤보 '+game.maxCombo
    + ' · '+Math.floor(sec/60)+'분 '+sec%60+'초</div>'
    + '<div id="rankBox" style="margin-top:12px"></div>'
    + '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  const part = G.name.replace(/^[^ ]+ /,'');
  lastResult = { mode:'CAD·3D모델링 — '+part, score:pct, correct:game.correct,
                 total:CFG.gameN, wrong:game.wrong, durationSec:sec };
  mountSubmit(part);

  const again = el('<div class="card row">'
    + '<button class="btn btn-primary" id="ag">🔁 한 판 더</button>'
    + '<button class="btn" id="bk">🎮 다른 게임</button></div>');
  v.appendChild(again);
  again.querySelector('#ag').onclick = ()=>startGame(game.key);
  again.querySelector('#bk').onclick = ()=>render('game');

  try{ if(window.FX && pct>=60) FX.banner({ title: pct>=90?'훌륭합니다!':'통과!',
        sub: part+' '+pct+'점', stars: FX.starsFor?FX.starsFor(pct):0 }); }catch(e){}
  try{ if(window.Rank){ const r=Rank.award(pct,{mode:'CAD·3D모델링 — '+part});
        $('#rankBox').innerHTML = Rank.resultBox(r); } }catch(e){}
}

/* ══════════════════ 연습 · 종합시험 ══════════════════
   연습  : 고르는 즉시 정답·해설 공개, 점수 실시간, 연출 있음
   종합  : 아무것도 알려주지 않음, 점수 감춤, 연출 없음 (규약 2) */
function startQuiz(v, mode){
  const n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode, i:0, correct:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)),
           startTime: Date.now() };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}

function drawQ(v){
  const q = quiz.list[quiz.i];
  const isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  const card = el('<div class="card">'
    + '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length
    + (isExam ? '<span class="pill" style="margin-left:6px">채점은 마지막에</span>'
              : '<span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>')
    + '</div>'
    + '<div class="qtext">'+q.q+'</div>'
    + '<div id="chs"></div><div id="exp"></div></div>');
  v.appendChild(card);
  const chs = card.querySelector('#chs');
  q.ch.forEach((c,idx)=>{
    const b = el('<button class="choice">'+(idx+1)+'. '+c+'</button>');
    b.onclick = ()=>pick(v, idx, b);
    chs.appendChild(b);
  });
}

function pick(v, idx, btn){
  const q = quiz.list[quiz.i];
  const ok = idx === q.a;
  quiz.picks.push({q, pick:idx, ok});
  if(ok) quiz.correct++; else pushWrong(q, idx);

  if(quiz.mode==='exam'){
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }

  v.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('correct');
    if(i===idx) { b.classList.add('picked'); b.classList.add(ok?'correct':'wrong'); }
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  const exp = v.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>'+(ok?'맞았습니다':'정답은 '+(q.a+1)+'번')+'</b><br>'+(q.ex||'')+'</div>'));
  const next = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">'
    + (quiz.i+1>=quiz.list.length?'결과 보기':'다음 문제 →')+'</button></div>');
  exp.appendChild(next);
  next.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}

function pushWrong(q, p){
  ST.wrong = ST.wrong.filter(w => w.q !== q.q);
  ST.wrong.unshift({ unit:q.unit||'', q:q.q, ch:q.ch, a:q.a, pick:p, ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0, 100);
  save();
}

function finish(v){
  const n   = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  const part = quiz.mode==='exam' ? '종합시험' : '연습';

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">'
    + '<div class="score">'+pct+'점</div>'
    + '<div class="muted">'+n+'문항 중 '+quiz.correct+'개 정답 · '
    + Math.floor(sec/60)+'분 '+sec%60+'초</div>'
    + '<div id="rankBox" style="margin-top:12px"></div>'
    + '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  const bad = quiz.picks.filter(p=>!p.ok);
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(p=>{
      v.appendChild(el('<div class="card">'
        + '<span class="pill">'+(p.q.unit||'')+'</span>'
        + '<div class="qtext">'+p.q.q+'</div>'
        + '<div class="muted">내가 고른 답 : '+(p.pick+1)+'. '+p.q.ch[p.pick]+'</div>'
        + '<div style="color:var(--ok);font-weight:700">정답 : '+(p.q.a+1)+'. '+p.q.ch[p.q.a]+'</div>'
        + '<div class="explain">'+(p.q.ex||'')+'</div></div>'));
    });
  }

  /* 제출을 먼저 붙입니다 — 연출·계급에서 오류가 나도 제출 버튼은 살아 있어야 합니다. */
  lastResult = {
    mode : 'CAD·3D모델링 — '+part,
    score: pct, correct: quiz.correct, total: n,
    wrong: bad.map(p => (p.q.unit||'') + ' ' + p.q.q.replace(/<[^>]+>/g,'').slice(0,24)
                        + '… → 정답 ' + (p.q.a+1) + '번'),
    durationSec: sec,
  };
  mountSubmit(part);

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub: part+' '+pct+'점',
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:'CAD·3D모델링 — '+part });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) ── */
function mountSubmit(part){
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: ['CAD·3D모델링 '+part],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = '📤 ['+part+'] 결과 제출'; }
}

/* ── 오답노트 ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>연습이나 종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  v.appendChild(el('<div class="card row"><b>'+ST.wrong.length+'문항</b>'
    + '<button class="btn" id="clrWrong">비우기</button></div>'));
  $('#clrWrong').onclick = ()=>{ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(w=>{
    v.appendChild(el('<div class="card">'
      + '<span class="pill">'+w.unit+'</span>'
      + '<div class="qtext">'+w.q+'</div>'
      + '<div class="muted">내가 고른 답 : '+(w.pick+1)+'. '+w.ch[w.pick]+'</div>'
      + '<div style="color:var(--ok);font-weight:700">정답 : '+(w.a+1)+'. '+w.ch[w.a]+'</div>'
      + '<div class="explain">'+w.ex+'</div></div>'));
  });
}

(function(){
  const units = [];
  LEARN.forEach(c=>{ if(units.indexOf(c.unit)<0) units.push(c.unit); });
  $('#hdSub').textContent = '개념 '+LEARN.length+'장 · '+units.length+'단원 · 게임 '
    + Object.keys(GAMES).length+'종 · 문항 '+QUESTIONS.length;
})();
render('learn');
</script>
